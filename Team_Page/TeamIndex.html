<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teams</title>
    <link rel="stylesheet" href="TeamStyle.css">
</head>
<body>
    <div class="tab-bar">
        <button class="tab-btn" id="game-tab">Games</button>
        <button class="tab-btn" id="team-tab">Teams</button>
        <button class="tab-btn" if="stats-tab">Stats</button>
    </div>

    <div class="add-team">
        <input id="teamNameInput" type="text" placeholder="Team Name">
        <button id="addTeamBtn">Add Team</button>
    </div>
    
    <hr>

    <div id="teamContainer"></div>

    <div id="deleteOverlay" class="hidden">
        <div id="deletePopup">
            <h3>Delete Team</h3>
            <p>This Team Will be Permanently removed.</p>

            <button id="confirmDeleteBtn">Delete</button>
            <button id="cancelDeleteBtn">Cancel</button>
        </div>
    </div>

    <script src="TeamScript.js"></script>
</body>
</html>
